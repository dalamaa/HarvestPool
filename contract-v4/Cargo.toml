[package]
name = "harvest-pool-v4-contract"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Supplier-authorized group purchase escrow for HarvestPool V4"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = "1.8.1"
near-sdk = { version = "5.30.1", features = ["legacy"] }
schemars = "0.8.22"

[dev-dependencies]
anyhow = "1"
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
near-workspaces = "0.24.0-rc.2"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.85.1"
image_digest = "sha256:8fdfdbd178fdc78b8c8a58d1b5d6606bb7494ac2b28eea939dfbaf98a4f254a4"

[profile.release.package.harvest-pool-v4-contract]
codegen-units = 1
opt-level = "z"
