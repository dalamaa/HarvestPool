[package]
name = "harvest-pool-mock-usdc"
version = "0.1.0"
edition = "2021"
publish = false
license = "Apache-2.0"
description = "Standards-compatible NEP-141/NEP-145 USDC fixture for HarvestPool Sandbox tests"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
borsh = "1.8.1"
near-contract-standards = "5.30.1"
near-sdk = { version = "5.30.1", features = ["legacy"] }

[profile.release.package.harvest-pool-mock-usdc]
codegen-units = 1
opt-level = "z"
